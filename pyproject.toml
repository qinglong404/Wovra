[project]
name = "wovra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lkf", email = "lkf@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.6.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
wovra = "wovra.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
