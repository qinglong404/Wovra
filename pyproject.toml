[project]
name = "wovra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lkf", email = "lkf@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.6.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "socksio>=1.0.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
wovra = "wovra.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 本机 shell 若 source 过 ROS，PYTHONPATH 会把 launch_testing_ros 的
# pytest11 入口点带进插件自动加载——它在 venv 里 import yaml 直接炸。
# 显式封锁（别的机器没有该插件时 no: 静默忽略，无害）。
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_lint -p no:ament_pep257 -p no:ament_flake8 -p no:ament_xmllint"
