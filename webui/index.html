    const altChip=mainEntry&&mainEntry.alt_messages?`<span class="chip ${altOn?'acc':''}" style="cursor:pointer"
      title="分裂重组生效前的完整上下文（整理后全量装配）"
      onclick="openPendingView('__alt__')">重组前（整理后全量）</span>`:'';
    $('#d-sub').innerHTML=altChip+chips;
    const cmp=(pick.is_main&&pick.alt_chars)?`　对照：全量装配 ${fmtN(pick.alt_count||0)} 条 / ${fmtN(pick.alt_chars)} 字符（分裂前口径）`:'';
    if(altOn){
      const fds2=((pick.file_domains||[]).length)
        ?`<div class="ctx-note">文件域：${pick.file_domains.map(esc).join('、')}</div>`:'';
      $('#d-body').innerHTML=
        `<div class="ctx-stat">整理后 · 未按域重组（全量装配口径）· ${pick.alt_count||0} 条 · ≈${fmtN(pick.alt_tokens||0)} tok（${fmtN(pick.alt_chars||0)} 字符）</div>`
        + `<div class="ctx-note">这是分裂重组生效前的完整上下文：历史轮以折叠索引形式保留，未按域切分。</div>`
        + ctxMsgHtml(pick.alt_messages);
      return;
    }
    const fds=((pick.file_domains||[]).length)
      ?`<div class="ctx-note">文件域：${pick.file_domains.map(esc).join('、')}</div>`:'';
    $('#d-body').innerHTML=
      `<div class="ctx-stat">${pick.is_main?'主 agent':esc(pick.id||'')} ${esc(pick.name||'')} · ${pick.count} 条 · ≈${fmtN(pick.tokens||Math.round((pick.total_chars||0)/3))} tok（${fmtN(pick.total_chars)} 字符）${cmp}</div>`
      + fds
      + `<div class="ctx-note">${esc(d.note||'')}</div>`
      + ctxMsgHtml(pick.messages);
  }catch(e){$('#d-body').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}
}
async function openViewDrawer(view,id){
  // 上下文对照抽屉：可切"当前装配视图"（整理/压缩后）与"全量原文"（未压缩），
  // 用于人工核对压缩/整理/分裂机制是否按预期生效
  $('#mask').classList.add('open');$('#drawer').classList.add('open');
  $('#d-title').textContent='上下文对照 · '+(id||view||'主 agent');
  const mode=window._ctxMode||(view?'view':'view');
  $('#d-sub').innerHTML=`<span class="chip ${mode==='view'?'acc':''}" style="cursor:pointer" onclick="window._ctxMode='view';openViewDrawer('${esc(view||'')}','${esc(id||'')}')">整理/装配后</span>
    <span class="chip ${mode==='raw'?'acc':''}" style="cursor:pointer" onclick="window._ctxMode='raw';openViewDrawer('${esc(view||'')}','${esc(id||'')}')">全量原文</span>`;
  $('#d-body').innerHTML='<div class="empty">装配中…</div>';
  try{
    const url=`/api/sessions/${CUR}/context?mode=${mode}`+
      (mode==='view'&&view?`&view=${encodeURIComponent(view)}`:'');
    const d=await api(url);
    if(!d.available){
      $('#d-body').innerHTML=`<div class="empty">${esc(d.note||'不可用')}<br><br>
        <span class="chip acc" style="cursor:pointer" onclick="window._ctxMode='raw';openViewDrawer('','')">看全量原文</span></div>`;
      return;
    }
    const tot=d.total_chars||0;
    const head=`<div class="ctx-stat">${d.count||d.messages.length} 条消息 · ${fmtN(tot)} 字符（≈${fmtN(Math.round(tot/3))} tok）${d.truncated?` · ${d.truncated} 条展示截断`:''}</div>`+
      (d.note?`<div class="ctx-note">${esc(d.note)}</div>`:'');
    $('#d-body').innerHTML=head+ctxMsgHtml(d.messages);
  }catch(e){$('#d-body').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}
}

/* ---------- 用量 ---------- */
function renderUsage(c){
  const u=META.usage||{};
  const hit=u.cached||0, miss=u.miss||0, tot=hit+miss;
  const fin=u.finish||{};
  const rows=u.rows||[];
  const max=Math.max(1,...rows.map(r=>r.prompt||0));
  const W=1000,H=130,bw=rows.length?Math.max(2,W/rows.length-1):0;
  const bars=rows.map((r,i)=>{
    const p=r.prompt||0, h=Math.max(2,Math.log10(p+1)/Math.log10(max+1)*(H-24));
    const ratio=p?(r.cached||0)/p:0;
    const col=ratio>0.9?'#3ddc97':ratio>0.5?'#ffb454':'#ff6b7a';
    return `<rect x="${(i*W/rows.length).toFixed(1)}" y="${(H-16-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}" opacity=".85"><title>${esc(r.time||'')} · ${esc(r.purpose)} prompt=${fmtN(p)} 命中=${fmtP(ratio,1)} ttft=${r.ttft??'—'}s finish=${esc(r.finish||'')}</title></rect>`;
  }).join('');
  const astats=META.agent_stats||[];
  const prettyName=k=>REG[k]?.name||REG[k]?.id||k;
  const vs=(VIEWSIZES&&VIEWSIZES.agents)||[];
  const vsOf=a=>vs.find(x=>(x.id||'')===(a.agent||'')||(x.name||'')===prettyName(a.agent));
  const seenVs=new Set();
  const rowsAll=astats.map(a=>({kind:'stat',a,vs:vsOf(a)}));
  // 分裂产出、尚未有运行时账的子 agent：也列出（视图体量已知，用量为空）
  for(const x of vs){
    if(x.is_main)continue;
    const dup=astats.some(a=>(a.agent||'')===(x.id||'')||prettyName(a.agent)===(x.name||''));
    if(dup)continue;
    seenVs.add(x.id||x.name);
    rowsAll.push({kind:'pending',x});
  }
  const agentTable=!rowsAll.length?'':`
    <h3 class="sec">按 agent 聚合（轮次/步数精确；用量按 steps 签名归属，近似口径）</h3>
    <table class="tbl"><thead><tr>
      <th>agent</th><th>轮次</th><th>步数</th><th>上下文峰值 tok</th>
      <th>单轮消费 tok</th><th>重组后视图 tok</th><th>Σprompt tok</th><th>Σ输出 tok</th><th>命中率</th></tr></thead>
      <tbody>${rowsAll.map(r=>{
        if(r.kind==='pending'){
          const x=r.x;
          return `<tr><td><span class="mono" style="color:${agentColor(x.id||x.name)}">${esc(x.id||'')}</span> <span class="mono" style="color:var(--tx3)">${esc(x.name||'')}</span></td>
            <td class="mono" colspan="4" style="color:var(--tx3)">尚未接活（分裂产出，待路由到它才有轮次与用量）</td>
            <td class="mono" style="color:var(--acc)">${fmtN(x.tokens||0)}</td>
            <td class="mono">—</td><td class="mono">—</td><td class="mono">—</td></tr>`;
        }
        const a=r.a;
        const hitA=fmtP(a.cached||0,(a.cached||0)+(a.miss||0));
        const vTok=r.vs?(r.vs.tokens||0):(a.agent==='Main'?0:0);
        return `<tr><td><span class="mono" style="color:${agentColor(a.agent)}">${esc(prettyName(a.agent))}</span> <span class="mono" style="color:var(--tx3)">${esc(a.agent)}</span></td>
          <td class="mono">${a.rounds}</td><td class="mono">${fmtN(a.steps||0)}</td>
          <td class="mono">${fmtN(a.ctx_peak||0)}</td><td class="mono">${fmtN(a.avg_prompt||0)}</td>
          <td class="mono" style="color:var(--acc)">${vTok?fmtN(vTok):'—'}</td>
          <td class="mono">${fmtN(a.prompt||0)}</td><td class="mono">${fmtN(a.completion||0)}</td>
          <td class="mono" style="color:var(--teal)">${hitA}</td></tr>`}).join('')}</tbody></table>`;
  c.innerHTML=
    agentTable+
    `<h3 class="sec">缓存命中（口径 = llm.py 落账）</h3>
     <div class="hitbar"><div class="c" style="flex:${Math.max(hit,0.0001)}">${tot&&hit/tot>0.15?`命中 ${fmtN(hit)}`:''}</div>
     <div class="m" style="flex:${Math.max(miss,0.0001)}">${tot&&miss/tot>0.15?`未命中 ${fmtN(miss)}`:''}</div></div>
     <div style="display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--tx2)">
       <span>命中率 <b class="mono" style="color:var(--teal)">${fmtP(hit,tot)}</b></span>
       <span class="mono">命中 ${fmtN(hit)} / 未命中 ${fmtN(miss)}</span>
       <span>命中价按 WOVRA_CACHE_RATE 计——条形只看体量占比</span></div>
     <h3 class="sec">逐调用 prompt 体量（对数高 · 颜色 = 命中率）· ${rows.length} 次</h3>
     <div class="spark"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">${bars}</svg></div>
     <h3 class="sec">结束原因分布</h3>
     <div class="finish-chips">${Object.entries(fin).map(([k,n])=>`<span class="chip acc">${esc(k)} × ${n}</span>`).join('')||'<span class="chip">无数据</span>'}</div>
     <h3 class="sec">最近调用</h3>
     <div class="lcard"><ul style="max-height:300px">${[...rows].reverse().slice(0,40).map(r=>
       `<li><span class="n">${esc(fmtT(r.time))}</span><pre class="mono" style="font-size:11px">[${esc(r.purpose)}] prompt=${fmtN(r.prompt||0)} cached=${fmtN(r.cached||0)} ttft=${r.ttft??'—'}s dur=${r.dur??'—'}s finish=${esc(r.finish||'')}</pre></li>`).join('')}</ul></div>`;
}

/* ---------- 抽屉 ---------- */
async function openDrawer(seq,hl){
  $('#mask').classList.add('open');$('#drawer').classList.add('open');
  $('#d-title').textContent='R'+seq+' 事件原文';
  $('#d-sub').textContent=hl||'';
  $('#d-body').innerHTML='<div class="empty">加载中…</div>';
  try{
    const d=await api(`/api/sessions/${CUR}/rounds/${seq}`);
    $('#d-body').innerHTML=(d.events||[]).map(e=>{
      const tc=e.tool_calls?`<div class="mono" style="font-size:10.5px;color:var(--acc);padding:4px 10px 0">${esc(JSON.stringify(e.tool_calls)).slice(0,300)}</div>`:'';
      const body=String(e.content||'').slice(0,1200);
      return `<div class="ev${hl===e.id?' hl':''}"><div class="e-head"><b>${esc(e.id)}</b>
        <span class="e-role role-${esc(e.role||'user')}">${esc(e.role||'?')}</span>
        <span>${esc(e.type)}</span>${e.status?`<span>${esc(e.status)}</span>`:''}</div>
        ${tc}<div class="e-body">${esc(body)||'<i style="color:var(--tx3)">（空）</i>'}${String(e.content||'').length>1200?'<i style="color:var(--tx3)">…（截断展示）</i>':''}</div></div>`;
    }).join('')||'<div class="empty">此轮无事件</div>';
  }catch(e){$('#d-body').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}
}
function closeDrawer(){$('#drawer').classList.remove('open');$('#mask').classList.remove('open')}
$('#mask').addEventListener('click',()=>{
  if($('#ws-modal').classList.contains('open'))closeWsModal();
  else closeDrawer();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#ws-modal').classList.contains('open'))closeWsModal();
    else closeDrawer();
  }
  if(e.key==='Enter'&&$('#ws-modal').classList.contains('open'))createSession();
});

/* ---------- 启动 ---------- */
loadSessions();
POLL=setInterval(loadSessions,5000);
</script>
